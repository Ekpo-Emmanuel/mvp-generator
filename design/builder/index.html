<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Build your starter · mvp</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mvp-theme");
          if (!t)
            t = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
    />
    <style>
      :root {
        --bg: #fff;
        --panel: #fff;
        --wash: #f7f8f1;
        --sunk: #eff2e3;
        --ink: #12140d;
        --ink-2: #3a3d30;
        --mute: #5e6256;
        --line: #e2e5d3;
        --line-2: #c9ceb5;
        --accent: #e3f23f;
        --accent-soft: #f5facb;
        --on-accent: #12140d;
        --term: #12140d;
        --action: #12140d;
        --on-action: #fff;
        --font-display: "Fraunces", Georgia, "Times New Roman", serif;
        --font-sans: "Geist", system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, monospace;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 14px;
        --radius-xl: 18px;
        --gut: 28px;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d0f09;
        --panel: #14170e;
        --wash: #1a1d13;
        --sunk: #1a1d13;
        --ink: #ecefdd;
        --ink-2: #c4c8b1;
        --mute: #9aa085;
        --line: #262a1c;
        --line-2: #373c29;
        --accent-soft: #2b330c;
        --term: #050603;
        --action: #ecefdd;
        --on-action: #12140d;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      .ic {
        width: 1.15em;
        height: 1.15em;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      /* header */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
        padding: 0 var(--gut);
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 600 1.2rem var(--font-sans);
        letter-spacing: -0.03em;
        color: var(--ink);
        text-decoration: none;
      }
      .logo svg {
        width: 22px;
        height: 22px;
      }
      .top-r {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .exit {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--ink-2);
        text-decoration: none;
        padding: 8px 10px;
        border-radius: var(--radius-md);
      }
      .exit:hover {
        color: var(--ink);
        background: var(--sunk);
      }
      .theme {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--ink-2);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .theme:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .theme .ic {
        grid-area: 1/1;
        width: 18px;
        height: 18px;
        stroke-width: 1.8;
        transition:
          transform 0.45s cubic-bezier(0.3, 0.8, 0.3, 1),
          opacity 0.25s;
      }
      .theme .sun {
        opacity: 0;
        transform: rotate(-70deg) scale(0.5);
      }
      html[data-theme="dark"] .theme .sun {
        opacity: 1;
        transform: none;
      }
      html[data-theme="dark"] .theme .moon {
        opacity: 0;
        transform: rotate(70deg) scale(0.5);
      }
      @media (prefers-reduced-motion: no-preference) {
        .theme-anim,
        .theme-anim *,
        .theme-anim *::before,
        .theme-anim *::after {
          transition:
            background-color 0.3s,
            color 0.3s,
            border-color 0.3s,
            fill 0.3s,
            stroke 0.3s !important;
        }
      }

      /* step rail */
      .rail-wrap {
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
        padding: 6px var(--gut) 0;
      }
      .rail {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .rail button {
        all: unset;
        box-sizing: border-box;
        display: block;
        width: 100%;
        cursor: pointer;
        padding: 0 0 2px;
      }
      .rail button[disabled] {
        cursor: default;
      }
      .rail .bar {
        display: block;
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
        position: relative;
      }
      .rail .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.5s cubic-bezier(0.3, 0.8, 0.3, 1);
      }
      .rail li.done .bar::after,
      .rail li.now .bar::after {
        transform: scaleX(1);
      }
      .rail li.now .bar::after {
        background: var(--ink);
      }
      .rail .lab {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 10px;
        font: 500 0.8125rem var(--font-sans);
        color: var(--mute);
        white-space: nowrap;
        transition: color 0.2s;
      }
      .rail .lab i {
        font: 500 0.6875rem var(--font-mono);
        font-style: normal;
        letter-spacing: 0.02em;
      }
      .rail li.done .lab {
        color: var(--ink-2);
      }
      .rail li.now .lab {
        color: var(--ink);
        font-weight: 600;
      }
      .rail button:not([disabled]):hover .lab {
        color: var(--ink);
      }
      .rail button:focus-visible {
        outline-offset: 4px;
        border-radius: 4px;
      }

      /* layout */
      main {
        flex: 1;
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px var(--gut) 40px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 400px;
        gap: 56px;
        align-items: start;
      }
      .stage {
        min-width: 0;
      }
      .eyebrow {
        font: 500 0.75rem var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mute);
        margin: 0 0 14px;
      }
      h1 {
        font: 600 2.75rem/1.06 var(--font-display);
        letter-spacing: -0.025em;
        margin: 0;
        font-variation-settings: "opsz" 96;
        text-wrap: balance;
      }
      .sub {
        margin: 14px 0 0;
        color: var(--mute);
        font-size: 1.0625rem;
        max-width: 46ch;
      }
      .body {
        margin-top: 32px;
      }
      .enter-f {
        animation: inF 0.42s cubic-bezier(0.3, 0.8, 0.3, 1) both;
      }
      .enter-b {
        animation: inB 0.42s cubic-bezier(0.3, 0.8, 0.3, 1) both;
      }
      @keyframes inF {
        from {
          opacity: 0;
          transform: translateX(14px);
        }
      }
      @keyframes inB {
        from {
          opacity: 0;
          transform: translateX(-14px);
        }
      }

      /* option cards */
      .opts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .opt {
        position: relative;
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 14px;
        align-items: center;
        padding: 14px 16px 14px 14px;
        background: var(--panel);
        border: 1px solid var(--line-2);
        border-radius: var(--radius-lg);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.2s,
          transform 0.2s;
      }
      .opt:hover {
        border-color: var(--ink);
      }
      .opt:active {
        transform: scale(0.99);
      }
      .opt .tile {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        transition: border-color 0.2s;
      }
      html[data-theme="dark"] .opt .tile {
        border-color: transparent;
      }
      .opt .tile svg {
        width: 24px;
        height: 24px;
      }
      .opt .tile .ic {
        color: #5e6256;
        stroke-width: 1.8;
        width: 22px;
        height: 22px;
      }
      .opt .tile .mono {
        font: 600 1rem var(--font-mono);
        color: #12140d;
      }
      .opt b {
        display: block;
        font: 600 1rem/1.25 var(--font-sans);
        letter-spacing: -0.01em;
        padding-right: 26px;
      }
      .opt small {
        display: block;
        margin-top: 2px;
        font-size: 0.8125rem;
        line-height: 1.4;
        color: var(--mute);
      }
      .opt .tick {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid var(--line-2);
        display: grid;
        place-items: center;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .opt .tick .ic {
        width: 12px;
        height: 12px;
        stroke-width: 3;
        color: var(--on-accent);
        stroke-dasharray: 20;
        stroke-dashoffset: 20;
        transition: stroke-dashoffset 0.3s 0.05s;
      }
      .opt:has(input:checked) {
        border-color: var(--ink);
        background: var(--accent-soft);
      }
      .opt:has(input:checked) .tick {
        background: var(--accent);
        border-color: #bfce26;
      }
      .opt:has(input:checked) .tick .ic {
        stroke-dashoffset: 0;
      }
      .opt:has(input:focus-visible) {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      .opts.skip-first .opt:first-child {
        grid-column: 1/-1;
      }

      /* review */
      .rev {
        border: 1px solid var(--line-2);
        border-radius: var(--radius-lg);
        background: var(--panel);
        overflow: hidden;
      }
      .rev-row {
        display: grid;
        grid-template-columns: 96px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
      }
      .rev-row:first-child {
        border-top: 0;
      }
      .rev-row .k {
        font: 500 0.75rem var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .rev-row .v {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        min-width: 0;
      }
      .rev-row .v .tile {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        flex: none;
      }
      html[data-theme="dark"] .rev-row .v .tile {
        border-color: transparent;
      }
      .rev-row .v .tile svg {
        width: 17px;
        height: 17px;
      }
      .rev-row .v .tile .ic {
        color: #5e6256;
        width: 16px;
        height: 16px;
        stroke-width: 1.8;
      }
      .rev-row .v .tile .mono {
        font: 600 0.8rem var(--font-mono);
        color: #12140d;
      }
      .rev-row .v span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .link {
        all: unset;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--ink-2);
        padding: 6px 8px;
        margin: -6px -8px;
        border-radius: var(--radius-sm);
        text-decoration: underline;
        text-decoration-color: var(--line-2);
        text-underline-offset: 3px;
      }
      .link:hover {
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .link:focus-visible {
        outline: 2px solid var(--ink);
      }
      .field {
        margin-top: 24px;
      }
      .field label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .field .in {
        display: flex;
        align-items: center;
        height: 46px;
        border: 1px solid var(--line-2);
        border-radius: var(--radius-md);
        background: var(--panel);
        padding: 0 14px;
        font-family: var(--font-mono);
        font-size: 0.9375rem;
        transition: border-color 0.15s;
      }
      .field .in:focus-within {
        border-color: var(--ink);
      }
      .field .in input {
        all: unset;
        flex: 1;
        min-width: 0;
      }
      .field .in em {
        font-style: normal;
        color: var(--mute);
      }
      .field p {
        margin: 8px 0 0;
        font-size: 0.8125rem;
        color: var(--mute);
      }

      /* buttons (design system) */
      .btn {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 46px;
        padding: 0 20px;
        border-radius: var(--radius-md);
        border: 1px solid transparent;
        font: 600 0.94rem var(--font-sans);
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.15s,
          border-color 0.15s;
        white-space: nowrap;
      }
      .btn::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          105deg,
          transparent 35%,
          rgba(255, 255, 255, 0.28) 50%,
          transparent 65%
        );
        transform: translateX(-120%);
        transition: transform 0.7s;
      }
      .btn:hover::after {
        transform: translateX(120%);
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-accent {
        background: linear-gradient(180deg, #ecf863, #e3f23f 55%, #daea30);
        border-color: #bfce26;
        color: #12140d;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.65),
          inset 0 -1px 0 rgba(120, 135, 10, 0.22);
      }
      .btn-line {
        background: var(--panel);
        border-color: var(--line-2);
        color: var(--ink);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      html[data-theme="dark"] .btn-line {
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .btn-line:hover {
        border-color: var(--ink);
      }
      .btn[disabled] {
        opacity: 0.45;
        pointer-events: none;
      }
      .btn.work {
        pointer-events: none;
      }
      .btn .prog {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: 100%;
        background: var(--ink);
        transform-origin: left;
        animation: prog 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: -1;
      }
      @keyframes prog {
        0% {
          transform: scaleX(0);
          transform-origin: left;
        }
        50% {
          transform: scaleX(1);
          transform-origin: left;
        }
        51% {
          transform: scaleX(1);
          transform-origin: right;
        }
        100% {
          transform: scaleX(0);
          transform-origin: right;
        }
      }

      /* preview terminal */
      .preview {
        position: sticky;
        top: 24px;
      }
      .pv-cap {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 0 2px 10px;
        font: 500 0.75rem var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .pv-cap span:last-child {
        text-transform: none;
        letter-spacing: 0;
      }
      .term {
        background: var(--term);
        color: #e8ebda;
        border-radius: var(--radius-lg);
        overflow: hidden;
        font: 400 0.75rem var(--font-mono);
      }
      .term .h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 40px;
        padding: 0 14px;
        border-bottom: 1px solid #292c20;
      }
      .term .h b {
        font-weight: 500;
        color: var(--accent);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 70%;
      }
      .term .h span {
        color: #9ea38f;
        font-variant-numeric: tabular-nums;
      }
      .term ol {
        list-style: none;
        margin: 0;
        padding: 6px 0;
        min-height: 312px;
      }
      .term li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        height: 26px;
        padding: 0 14px;
        white-space: nowrap;
      }
      .term li > span {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .term li i {
        font-style: normal;
        color: #858a74;
      }
      .term li.new {
        animation: rowIn 0.5s cubic-bezier(0.3, 0.8, 0.3, 1) both;
      }
      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(5px);
          background: rgba(227, 242, 63, 0.14);
        }
        60% {
          background: rgba(227, 242, 63, 0.14);
        }
        to {
          background: transparent;
        }
      }
      .tg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 0.75rem var(--font-sans);
        background: rgba(255, 255, 255, 0.09);
        border-radius: var(--radius-sm);
        padding: 2px 8px 2px 3px;
        flex: none;
      }
      .tg s {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        background: #fff;
        display: grid;
        place-items: center;
        text-decoration: none;
      }
      .tg s svg {
        width: 10px;
        height: 10px;
      }
      .tg s .mono {
        font: 700 9px var(--font-mono);
        color: #12140d;
      }
      .term .s {
        display: flex;
        align-items: center;
        height: 42px;
        padding: 0 14px;
        border-top: 1px solid #292c20;
        color: #9ea38f;
        white-space: nowrap;
        overflow: hidden;
      }
      .term .s b {
        font-weight: 400;
        color: var(--accent);
      }
      .term .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 9px;
        animation: pulse 2.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .term .caret {
        display: inline-block;
        width: 6px;
        height: 12px;
        background: var(--accent);
        margin-left: 6px;
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .pv-note {
        margin: 10px 2px 0;
        font-size: 0.75rem;
        color: var(--mute);
      }

      /* bottom nav */
      .nav {
        position: sticky;
        bottom: 0;
        z-index: 5;
        background: var(--bg);
        border-top: 1px solid var(--line);
      }
      .nav-in {
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px var(--gut);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .nav .mid {
        flex: 1;
        min-width: 0;
        font: 500 0.75rem var(--font-mono);
        color: var(--mute);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav .mid b {
        font-weight: 500;
        color: var(--ink-2);
      }
      .nav .btn-accent {
        min-width: 132px;
      }
      .status {
        position: fixed;
        left: 50%;
        bottom: 84px;
        transform: translate(-50%, 10px);
        background: var(--term);
        color: #e8ebda;
        font: 500 0.8125rem var(--font-sans);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s,
          transform 0.25s;
        max-width: calc(100vw - 36px);
        text-align: center;
        z-index: 10;
      }
      .status.on {

            var p = b.querySelector(".prog");
            if (p) p.remove();
            drawNav();
          });
      });
      $("#theme").addEventListener("click", function () {
        var h = document.documentElement;
        h.classList.add("theme-anim");
        var n = h.getAttribute("data-theme") === "dark" ? "light" : "dark";
        h.setAttribute("data-theme", n);
        try {
          localStorage.setItem("mvp-theme", n);
        } catch (e) {}
        setTimeout(function () {
          h.classList.remove("theme-anim");
        }, 400);
      });
      render();
    </script>
  </body>
</html>
