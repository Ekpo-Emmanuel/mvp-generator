<!doctype html><meta charset="utf-8" /><link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
/>
<style>
  body {
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 42px;
    padding: 0 18px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    font: 600 0.94rem var(--font-sans);
    cursor: pointer;
    transition:
      transform 0.2s,
      background 0.15s;
  }
  .btn svg {
    width: 1.15em;
    height: 1.15em;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
      105deg,
      transparent 35%,
      rgba(255, 255, 255, 0.28) 50%,
      transparent 65%
    );
    transform: translateX(-120%);
    transition: transform 0.7s;
  }
  .btn:hover::after {
    transform: translateX(120%);
  }
  .btn:hover {
    transform: translateY(-1px);
  }
  .btn:active {
    transform: translateY(1px);
  }
  .accent {
    background: linear-gradient(180deg, #ecf863, #e3f23f 55%, #daea30);
    border-color: #bfce26;
    color: var(--on-accent);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.65),
      inset 0 -1px 0 rgba(120, 135, 10, 0.22);
  }
  .action {
    background: var(--action);
    color: var(--on-action);
    border-color: var(--action);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
  }
  .line {
    background: var(--panel);
    border-color: var(--line-2);
    color: var(--ink);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .line:hover {
    border-color: var(--ink);
  }
  .sm {
    height: 36px;
    padding: 0 14px;
    font-size: 14px;
  }
</style>
<svg width="0" height="0" style="position: absolute">
  <symbol id="r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
  <symbol id="d" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" /></symbol>
</svg>
<div class="row">
  <button class="btn accent">
    Build your starter <svg><use href="#r" /></svg></button
  ><button class="btn line">
    Take a look inside <svg><use href="#d" /></svg></button
  ><button class="btn action sm">Create a project</button>
</div>
