<!-- @dsCard group="Containers" height=300 subtitle="illustration + text" -->
<!doctype html><meta charset="utf-8" /><link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
/>
<style>
  body {
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .card {
    max-width: 420px;
    border: 1px solid var(--line-2);
    border-radius: var(--radius-lg);
    background: var(--panel);
    overflow: hidden;
  }
  .art {
    height: 130px;
    background: var(--sunk);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 11px;
    padding: 10px 16px;
    font: 650 0.92rem var(--font-display);
  }
  .body {
    padding: 20px 22px 24px;
  }
  h3 {
    margin: 0 0 8px;
    font: 600 1.44rem/1.2 var(--font-display);
    letter-spacing: -0.01em;
  }
  p {
    margin: 0;
    color: var(--ink-2);
    font-size: 0.94rem;
    line-height: 1.6;
  }
</style>
<div class="card">
  <div class="art"><span class="chip">Next.js</span></div>
  <div class="body">
    <h3>Your tools belong together.</h3>
    <p>
      Pick the services you already know. Get the dependencies, providers and
      placeholders in one project.
    </p>
  </div>
</div>
